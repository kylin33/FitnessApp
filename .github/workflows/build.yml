name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        env:
          VERSION_NAME: "1.0.${{ github.run_number }}"
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug    \
            -PVERSION_CODE=$VERSION_CODE \
            -PVERSION_NAME=$VERSION_NAME

      - name: Decode signing keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_KEYSTORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != '' }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ env.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/ci-signing.keystore"

      - name: Build signed release APK
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_KEYSTORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != '' }}
        env:
          VERSION_NAME: "1.0.${{ github.run_number }}"
          VERSION_CODE: ${{ github.run_number }}
          CI_KEYSTORE_PATH: "${{ runner.temp }}/ci-signing.keystore"
          CI_KEYSTORE_PASSWORD: ${{ env.SIGNING_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=$VERSION_CODE \
            -PVERSION_NAME=$VERSION_NAME

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        if: ${{ success() && env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_KEYSTORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
